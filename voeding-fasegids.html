const $=id=>document.getElementById(id);
let meal='lunch';
function drawMeals(){const rows=meals[$('phase').value][meal];$('recipes').innerHTML=rows.map(r=>'<details><summary><span>'+r.title+'<small>'+r.macros.p+' g eiwit per portie</small></span></summary><div class="body"><p>'+r.macros.kcal+' kcal · '+r.macros.c+' g koolhydraten · '+r.macros.f+' g vet</p><ul>'+r.ingredients.map(i=>'<li>'+i+'</li>').join('')+'</ul></div></details>').join('');document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-pressed',b.value===meal))}
function draw(){const [name,title,intro,ink,wash,soft,keys]=phases[$('phase').value];const style=document.querySelector('.screen').style;Object.entries({ink,wash,soft}).forEach(([k,v])=>style.setProperty('--'+k,v));$('phaseName').textContent=name;$('title').textContent=title;$('intro').textContent=intro;$('nutrients').innerHTML=keys.map((k,i)=>{const [sym,name,why,foods,tip]=nutrients[k];return '<details name="nutrient" '+(!i?'open':'')+'><summary><span class="symbol" aria-hidden="true">'+sym+'</span>'+name+'</summary><div class="body"><p>'+why+'</p><div class="chips">'+foods.split('|').map(x=>'<span>'+x+'</span>').join('')+'</div><p class="tip"><b>Op je bord</b> · '+tip+'</p></div></details>'}).join('');drawMeals()}
for(const m of ['ontbijt','lunch','diner','snack']){const b=document.createElement('button');b.value=m;b.textContent=m[0].toUpperCase()+m.slice(1);b.onclick=()=>{meal=m;drawMeals()};document.querySelector('.tabbar').append(b)}$('phase').onchange=draw;draw();
</script></html>
